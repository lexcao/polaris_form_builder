name: Sync Components

# PRs opened with the default GITHUB_TOKEN do not run pull_request workflows.
# GitHub records those runs as action_required and starts no jobs until a
# maintainer approves them (runs left unapproved for 30 days then fail).
# This workflow runs ci.yml on the synced commit, then opens the PR and
# squash-merges it only after that CI passes. main has no required checks,
# so the merge is a normal squash merge: no --admin, and no auto-merge setting.
on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-components
  cancel-in-progress: false

jobs:
  sync:
    name: Sync component data
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
      branch: ${{ steps.commit.outputs.branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set cache key date
        id: cache_date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore sync cache
        uses: actions/cache@v4
        with:
          path: bin/dev/tmp
          key: sync-cache-${{ runner.os }}-${{ steps.cache_date.outputs.day }}

      - name: Sync components
        run: bin/command sync

      - name: Commit and push synced data
        id: commit
        run: |
          set -euo pipefail
          branch="bot/daily-components-sync"
          remote_ref="refs/heads/${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          git add -A -- data/components
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No component data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sync): update Polaris component data"
          sha="$(git rev-parse HEAD)"

          # Squash-merging the previous sync leaves this branch diverged from
          # main, so replacing it is not a fast-forward. The ref is the bot
          # branch only; main's ruleset is untouched.
          git push --force origin "HEAD:${remote_ref}"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: sync
    if: needs.sync.outputs.changed == 'true' && needs.sync.outputs.sha != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.sync.outputs.branch }}
      sha: ${{ needs.sync.outputs.sha }}
    permissions:
      contents: read

  merge:
    name: Open and merge pull request
    needs: [sync, ci]
    if: needs.sync.outputs.changed == 'true' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the pull request and squash-merge it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          EXPECTED_SHA: ${{ needs.sync.outputs.sha }}
          SYNC_BRANCH: ${{ needs.sync.outputs.branch }}
        run: |
          set -euo pipefail
          title="chore(sync): daily Polaris component sync"
          body="$(cat <<'EOF'
          Automated daily sync for component metadata and examples.

          - Triggered by the Sync Components workflow
          - Generated by `bin/command sync`
          - Merged after `bin/ci` passed on this commit
          EOF
          )"

          owner="${GITHUB_REPOSITORY%%/*}"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${owner}:${SYNC_BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$SYNC_BRANCH" --title "$title" --body "$body"
            number="$(gh pr view "$SYNC_BRANCH" --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
          else
            number="$existing"
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

          merged=0
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$EXPECTED_SHA"; then
              merged=1
              break
            fi
            echo "Squash merge was not accepted (attempt ${attempt} of 6)."
            sleep 10
          done
          if [ "$merged" -ne 1 ]; then
            echo "Refusing to merge ${EXPECTED_SHA}. Branch protection was not bypassed."
            exit 1
          fi

          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${SYNC_BRANCH}" \
            || echo "Head branch was already deleted."
